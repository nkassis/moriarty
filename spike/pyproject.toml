[project]
name = "spike"
version = "0.0.0"
description = "Walking skeleton: one agent resolves one sensor fault over RabbitMQ and MCP."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aio-pika",
    "httpx",
    "mcp",
    "pydantic",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Same cutoff as the root project.
exclude-newer = "2026-10-03T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

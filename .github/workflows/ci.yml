name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    name: python-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install Python and dependencies
        run: uv sync --all-packages --locked
      - name: Licenses
        # Exact, case-insensitive names: substring "GPL" would also match LGPL (psycopg).
        run: >-
          uv run pip-licenses --from=mixed --fail-on="GPL;GPLv2;GPLv3;GPLv2+;GPLv3+;
          GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;
          AGPL;AGPLv3;AGPLv3+;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;
          GNU General Public License (GPL);
          GNU General Public License v2 (GPLv2);
          GNU General Public License v2 or later (GPLv2+);
          GNU General Public License v3 (GPLv3);
          GNU General Public License v3 or later (GPLv3+);
          GNU Affero General Public License v3;
          GNU Affero General Public License v3 or later (AGPLv3+)"
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run black --check .
      - name: Test
        run: uv run pytest
      - name: Schema drift
        run: |
          uv run python -m ship.contract.generate
          git add -N ship/contract/schema/
          git diff --exit-code ship/contract/schema/

  bridge-check:
    name: bridge-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: bridge/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: bridge/.nvmrc
          cache: pnpm
          cache-dependency-path: bridge/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Token drift
        run: pnpm gen:tokens:check

  bridge-e2e:
    name: bridge-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Browsers and fonts come with the image; its tag must match @playwright/test in bridge/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: bridge/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: bridge/.nvmrc
          cache: pnpm
          cache-dependency-path: bridge/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: E2E
        # The html reporter only adds a report to upload; the config's list reporter still prints.
        run: pnpm e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: bridge/playwright-report/
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commits in this PR or push
        # The action scans the PR's base..head, or before..after on a push to main.
        # Pushes to other branches: secret-scan.yml.
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified  # the action already passes --fail

  # The only required check on main. A new job goes into `needs:` in the same PR.
  ci-ok:
    name: ci-ok
    needs: [python-check, bridge-check, bridge-e2e, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

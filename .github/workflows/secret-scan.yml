name: secret-scan

# Pushes to branches other than main. PRs and main run the `secret-scan` job in ci.yml,
# which is the one behind the required `ci-ok` check.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  secret-scan-push:
    name: secret-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commits in this push
        uses: trufflesecurity/trufflehog@main
        with:
          # Left empty, the action scans before..after.
          # A new branch has no `before`, so scan only what it adds over the default branch
          # instead of the full history. Full-history scans: docs/security.md.
          base: ${{ github.event.created && github.event.commits[0] && format('origin/{0}', github.event.repository.default_branch) || '' }}
          head: ${{ github.event.created && github.event.commits[0] && github.event.after || '' }}
          extra_args: --results=verified  # the action already passes --fail

name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commits in this push or PR
        uses: trufflesecurity/trufflehog@main
        with:
          # On a PR, scan only the commits the PR adds; on a push, only what the push adds.
          # Full-history scans run from the pre-commit hook or `make secret-scan-full`.
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail
